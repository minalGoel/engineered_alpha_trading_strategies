<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategy Dashboard</title>
<link rel="stylesheet" href="./style.css">
<script src="./chart.min.js"></script>
<script src="./config.js"></script>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1><span>Alpha</span> Strategy Dashboard</h1>
    <button class="tab-btn active" onclick="showTab('leaderboard')">Leaderboard</button>
    <button class="tab-btn" onclick="showTab('portfolio')">Portfolio</button>
    <span style="margin-left:auto;font-size:11px;color:var(--text2);font-weight:500" id="run-count"></span>
  </div>
  <div id="content">
    <div id="tab-leaderboard"></div>
    <div id="tab-portfolio" style="display:none"></div>
  </div>
</div>
<div id="strategy-overlay"></div>

<!-- Dashboard scripts (order matters: core first) -->
<script src="./core.js"></script>
<script src="./leaderboard.js"></script>
<script src="./overlay.js"></script>
<script src="./portfolio.js"></script>
</body>
</html>
